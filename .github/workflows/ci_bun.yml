name: bun CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        bun-version: [latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.x
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.x
      - name: Run dnt
        run: deno task dnt
      - name: Install build tools
        working-directory: ./npm
        run: npm ci
      - name: Add npm binaries to PATH
        run: echo "${GITHUB_WORKSPACE}/npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build test bundle
        run: deno task minify:mlkem > packages/mlkem/test/runtimes/mlkem.js
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Run test
        working-directory: ./packages/mlkem/test/runtimes/bun
        run: |
          nohup bun src/index.js &
          sleep 3
          deno test --import-map=../../../../../npm/import_map.json mlkem.spec.ts --allow-net --config=../../../../../deno.json
