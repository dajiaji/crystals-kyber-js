name: Deno CI

on:
  push:
    branches: [main, "release/**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main, "release/**"]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.x
      - name: Run deno test
        run: |
          deno task test
          deno task cov > coverage.lcov
      - name: Check that deno.lock is up to date
        # `deno publish` in the CD workflow aborts on a dirty working tree, so
        # catch lock drift here.
        run: git diff --exit-code deno.lock
      - uses: codecov/codecov-action@f32b3a3741e1053eb607407145bc9619351dc93b # v2.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov
          flags: unittests
      - name: Run deno publish (dry)
        run: deno publish --dry-run --allow-dirty
